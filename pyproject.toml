[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "tapbuild"
authors = [
    {name = "Dylan Righi", email = "dylan.righi@noaa.gov"},
    {name = "Chris Barker", email = "chris.barker@noaa.gov"},
    {name = "Rachael Mueller", email = "rachael.mueller@noaa.gov"},
    {name = "Amy MacFadyen", email = "amy.macfadyen@noaa.gov"},
]
description = "Scripts to run the PyGnome trajectory model to build up a TAP (Trajectory Analysis Planner) dataset."
readme = "README.rst"
requires-python = ">=3.10"
license = {file = "LICENSE"}
classifiers = [
        'Development Status :: 2 - Pre-Alpha',
        'Intended Audience :: Developers',
        'Natural Language :: English',
        'Programming Language :: Python :: 3',
]
# dependencies = [
#     "requests",
# ]
dynamic = ["version"]

[tool.setuptools.dynamic]
version = {attr = "tapbuild.__version__"}
readme = {file = ["README.rst"]}

# [project.optional-dependencies]
# pdf = ["ReportLab>=1.2", "RXP"]
# rest = ["docutils>=0.3", "pack ==1.1, ==1.3"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]  # list of folders that contain the packages (["."] by default)
# include = ["my_package*"]  # package names should match these glob patterns (["*"] by default)
# exclude = ["my_package.tests*"]  # exclude packages matching these glob patterns (empty by default)
namespaces = false  # to disable scanning PEP 420 namespaces (true by default)


[project.scripts]
tapbuild = "tapbuild.cli:main"

[tool.tox]
legacy_tox_ini = """
    [tox]
    min_version = 4.0
    env_list =
        py310
        py311
        py312
        flake8

    [testenv]
    deps = pytest
    commands = pytest tests

    [testenv:flake8]
    deps = flake8
    commands = flake8 tapbuild
"""
